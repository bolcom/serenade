[package]
name = "serenade"
description = "Serenade: Session-based recommender system"
keywords = ["recommendation"]
categories = ["science"]
readme = "README.md"
repository = "https://github.com/bolcom/serenade/"
license = "Apache-2.0"
version = "0.3.1"
authors = ["submission@sigmod2021.org"]
edition = "2021"


[[bin]]
name = "serving"
path = "src/bin/serving.rs"


[dependencies]
csv = "1.1"
rand = "0.8"
itertools = "0.10"
actix-web = "3.3"
futures = "0.3"
rocksdb = {version = "0.21", default-features = false}
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
actix-web-prom = "0.5"
sys-info = "0.9"
hashbrown = {version = "0.11", features = ["serde"]}
tdigest = "0.2"
uuid = "0.8"
md5 = "0.7"
rayon = "1.5.0"
dary_heap = "0.2.2"
avro-rs = {version = "0.13", features = ["snappy"]}
justconfig = "1.0"
tpe = "0.2.0"
anyhow = "1.0.53"
indicatif = "0.16.2"
# indicatif 0.16 disables console's default features but requires its std API.
console = { version = "0.16", default-features = false, features = ["std"] }
