# Run from the repository or extracted release root.
[hyperparam]
training_data_path = "assets/example/train.txt"
validation_data_path = "assets/example/valid.txt"
test_data_path = "assets/example/test.txt"
num_trials = 50
seed = 42
output_dir = "hpo-results"
enable_business_logic = true

# Ranges are inclusive for integer parameters; floating-point ranges retain decimals.
[hyperparam.algorithms.vmis]
enabled = true
m_most_recent_sessions_range = [100, 2500]
neighborhood_size_k_range = [50, 1500]
max_items_in_session_range = [1, 20]
idf_weighting_range = [0.0, 5.0]

[hyperparam.algorithms.sknn]
enabled = true
pop_boost_range = [0.0, 5.0]

[hyperparam.algorithms.vsknn]
enabled = true
idf_weighting_range = [0.0, 5.0]

[hyperparam.algorithms.stan]
enabled = true
lambda_spw_range = [0.1, 10.0]
lambda_snh_range = [0.1, 10.0]
lambda_inh_range = [0.1, 10.0]

[hyperparam.algorithms.vsknn_stan]
enabled = true
lambda_spw_range = [0.1, 10.0]
lambda_snh_range = [0.1, 10.0]
lambda_inh_range = [0.1, 10.0]
lambda_ipw_range = [0.1, 10.0]
lambda_idf_range = [0.1, 10.0]

[server]
host = "0.0.0.0"
port = 8081
num_workers = 4

[logic]
enable_business_logic = true
example_item_id = 13598
