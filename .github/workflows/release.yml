name: Binary release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after all builds pass
        type: boolean
        default: false
      release_tag:
        description: Existing version tag to publish (for example v0.3.3)
        type: string
        required: false
  push:
    branches: ['release/**']
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: binary-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release tag and immutable build commit
        id: resolve
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          tag=''
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            publish=true
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$MANUAL_PUBLISH" == true ]]; then
            publish=true
            tag="$REQUESTED_TAG"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            echo 'Select Publish a GitHub Release to use a release tag.' >&2
            exit 1
          fi
          ref="$GITHUB_SHA"
          version="validation-$GITHUB_SHA"
          if [[ "$publish" == true ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Publishing requires an existing tag such as v0.3.3.' >&2
              exit 1
            fi
            ref=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            version="$tag"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUSTFLAGS: ${{ matrix.platform == 'windows-x86_64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p test_package_release.py
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path (Join-Path $clang 'libclang.dll'))) { throw 'libclang.dll missing' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
      - name: macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable ${{ matrix.target }}
          rustc +stable -vV
      - name: Test
        run: cargo +stable test --locked --target ${{ matrix.target }}
      - name: Build applications
        run: cargo +stable build --locked --release --target ${{ matrix.target }} --bin serving --bin evaluator --bin tpe_hyperparameter_optm
      - name: Package, extract, and exercise applications
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/package_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }} --version ${{ env.PACKAGE_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: serenade-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: serenade-*
          merge-multiple: true
          path: dist
      - name: Verify complete release and publish draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows-x86_64 linux-x86_64 macos-x86_64 macos-aarch64; do
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then extension=zip; fi
            test -s "dist/serenade-$TAG-$platform.$extension"
            test -s "dist/serenade-$TAG-$platform.$extension.sha256"
          done
          (cd dist && sha256sum -c *.sha256)
          # Refuse to replace any existing release, including a failed draft.
          # The create API also rejects duplicates if another publisher races us.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > existing-tags
          if grep -Fxq "$TAG" existing-tags; then
            echo 'Release already exists; inspect it and explicitly remove an incomplete draft before retrying.' >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --draft --title "Serenade $TAG" --generate-notes
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false
