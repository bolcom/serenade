name: Serenade release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub binaries and crates.io package after validation
        type: boolean
        default: false
      release_tag:
        description: Existing version tag to publish (for example v0.3.3)
        type: string
        required: false
  push:
    branches: ['main', 'release/**']
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: binary-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release version detection
        run: python -m unittest discover -s scripts -p test_release_version.py
      - name: Resolve release tag and immutable build commit
        id: resolve
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          tag=''
          build=true
          automatic=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            publish=true
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            tag=$(python scripts/release_version.py "$BEFORE_SHA" "$GITHUB_SHA")
            if [[ -n "$tag" ]]; then
              publish=true
              automatic=true
            else
              build=false
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$MANUAL_PUBLISH" == true ]]; then
            publish=true
            tag="$REQUESTED_TAG"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            echo 'Select Publish a GitHub Release to use a release tag.' >&2
            exit 1
          fi
          ref="$GITHUB_SHA"
          version="validation-$GITHUB_SHA"
          if [[ "$publish" == true ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Publishing requires an existing tag such as v0.3.3.' >&2
              exit 1
            fi
            if [[ "$automatic" != true ]]; then
              ref=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            fi
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              tagged_ref=$(git rev-parse "refs/tags/$tag^{commit}")
              if [[ "$tagged_ref" != "$ref" ]]; then
                echo "Tag $tag already points to a different commit." >&2
                exit 1
              fi
            fi
            version="$tag"
            package_version=$(git show "$ref:Cargo.toml" | python -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')
            if [[ "v$package_version" != "$version" ]]; then
              echo 'Release tag must match Cargo.toml package.version.' >&2
              exit 1
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  build:
    if: needs.prepare.outputs.build == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUSTFLAGS: ${{ matrix.platform == 'windows-x86_64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p test_package_release.py
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path (Join-Path $clang 'libclang.dll'))) { throw 'libclang.dll missing' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
      - name: macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable ${{ matrix.target }}
          rustc +stable -vV
      - name: Test
        run: cargo +stable test --locked --target ${{ matrix.target }}
      - name: Build applications
        run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Package, extract, and exercise applications
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/package_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }} --version ${{ env.PACKAGE_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: serenade-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  crate:
    if: needs.prepare.outputs.build == 'true'
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test library with minimal dependencies
        run: cargo +stable test --locked --no-default-features
      - name: Validate minimal dependency graph
        shell: bash
        run: |
          cargo +stable tree --locked --no-default-features --prefix none > dependencies
          if grep -E '^(actix-web|rocksdb|librocksdb-sys|actix-web-prom|prometheus|tpe) v' dependencies; then
            echo 'Application dependency leaked into library build.' >&2
            exit 1
          fi
      - name: Build library documentation
        run: cargo +stable doc --locked --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Validate crates.io package (no publication)
        run: cargo +stable publish --locked --no-default-features --dry-run
  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build, crate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: actions/download-artifact@v6
        with:
          pattern: serenade-*
          merge-multiple: true
          path: dist
      - name: Verify complete release and publish draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows-x86_64 linux-x86_64 macos-x86_64 macos-aarch64; do
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then extension=zip; fi
            test -s "dist/serenade-$TAG-$platform.$extension"
            test -s "dist/serenade-$TAG-$platform.$extension.sha256"
          done
          (cd dist && sha256sum -c *.sha256)
          # Refuse to replace any existing release, including a failed draft.
          # The create API also rejects duplicates if another publisher races us.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > existing-tags
          if grep -Fxq "$TAG" existing-tags; then
            echo 'Release already exists; inspect it and explicitly remove an incomplete draft before retrying.' >&2
            exit 1
          fi
          # Never reuse a tag that identifies an untested commit.
          if tagged_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag $TAG points to a different commit." >&2
              exit 1
            fi
          else
            gh api "repos/$GH_REPO/git/refs" --method POST -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_SHA"
          fi
          gh release create "$TAG" --verify-tag --target "$RELEASE_SHA" --draft --title "Serenade $TAG" --generate-notes
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false
      - name: Authenticate to crates.io with trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - name: Publish corresponding Rust package
        run: cargo +stable publish --locked --no-default-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
