name: Binary release
on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Release PR number; bump, build, merge and publish (run on main)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: binary-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      version: ${{ steps.pr.outputs.version }}
      pr: ${{ steps.pr.outputs.pr }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release automation
        run: |
          python -m unittest discover -s scripts -p test_release_version.py
          python -m unittest discover -s scripts -p test_release_pr.py
      - name: Prepare release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: python scripts/release_pr.py prepare --pr "$RELEASE_PR"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUSTFLAGS: ${{ matrix.platform == 'windows-x86_64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p test_package_release.py
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path (Join-Path $clang 'libclang.dll'))) { throw 'libclang.dll missing' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
      - name: macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable ${{ matrix.target }}
          rustc +stable -vV
      - name: Test
        run: cargo +stable test --locked --target ${{ matrix.target }}
      - name: Build applications
        run: cargo +stable build --locked --release --target ${{ matrix.target }} --bin serving --bin evaluator --bin tpe_hyperparameter_optm
      - name: Package, extract, and exercise applications
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/package_release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }} --version ${{ env.PACKAGE_VERSION }}
      - uses: actions/upload-artifact@v7
        with:
          name: serenade-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  merge:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      ref: ${{ steps.merge.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Merge tested release PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ needs.prepare.outputs.pr }}
          TESTED_HEAD: ${{ needs.prepare.outputs.ref }}
          TESTED_BASE: ${{ needs.prepare.outputs.base }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: python scripts/release_pr.py merge --pr "$RELEASE_PR" --head "$TESTED_HEAD" --base "$TESTED_BASE" --result "$BUILD_RESULT"
  publish:
    if: needs.merge.result == 'success'
    needs: [prepare, build, merge]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: serenade-*
          merge-multiple: true
          path: dist
      - name: Verify complete release and publish draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.merge.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows-x86_64 linux-x86_64 macos-x86_64 macos-aarch64; do
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then extension=zip; fi
            test -s "dist/serenade-$TAG-$platform.$extension"
            test -s "dist/serenade-$TAG-$platform.$extension.sha256"
          done
          (cd dist && sha256sum -c *.sha256)
          # Refuse to replace any existing release, including a failed draft.
          # The create API also rejects duplicates if another publisher races us.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > existing-tags
          if grep -Fxq "$TAG" existing-tags; then
            echo 'Release already exists; inspect it and explicitly remove an incomplete draft before retrying.' >&2
            exit 1
          fi
          # Never reuse a tag that identifies an untested commit.
          if tagged_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag $TAG points to a different commit." >&2
              exit 1
            fi
          else
            gh api "repos/$GH_REPO/git/refs" --method POST -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_SHA"
          fi
          gh release create "$TAG" --verify-tag --target "$RELEASE_SHA" --draft --title "Serenade $TAG" --generate-notes
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false
